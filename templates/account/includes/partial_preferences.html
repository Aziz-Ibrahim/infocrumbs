{% load static %}
<h3>Your Topic Preferences</h3>

<div class="list-group dark-list-group">
    {% for topic in topics %}
        <div class="list-group-item d-flex align-items-start">
            <img 
                src="{% static topic.image|default:'images/topics/default.jpg' %}" 
                alt="{{ topic.name }}" 
                class="me-3 rounded" 
                style="width: 80px; height: 100px; object-fit: cover;"
            >
            <div class="flex-grow-1">
                <p class="mb-1">{{ topic.name }}</p>
            </div>
        </div>
    {% empty %}
        <p>No topics selected yet.</p>
    {% endfor %}
</div>

<div class="text-center my-4">
    {% if user_subscription %}
        <a href="{% url 'set_preferences' %}" class="neon-button">
            Edit Topic Preferences
        </a>
    {% else %}
        <a href="{% url 'choose_plan' %}" class="neon-button">
            Edit Topic Preferences
        </a>
    {% endif %}
</div>
